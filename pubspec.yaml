name: sheress
description: "Sheress - Multi-tenant financial reporting application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Supabase Backend
  supabase_flutter: ^2.16.0

  # Environment Variables
  flutter_dotenv: ^5.2.1

  # Networking & Connectivity
  connectivity_plus: ^6.1.1

  # SVG Rendering (for QRIS images)
  flutter_svg: ^2.0.17

  # Charts & Visualization
  fl_chart: ^0.69.2

  # Image Picker (QRIS Upload)
  image_picker: ^1.2.3

  # Google Fonts (Inter runtime download)
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.20.2
  path_provider: ^2.1.5
  sentry: ^9.24.0
  flutter_local_notifications: ^22.0.1
  shared_preferences: ^2.5.5
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Launcher Icons Generator
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icons/
    - assets/images/qris/

# Launcher Icons Configuration
# Place your source icon as assets/icons/app_icon.png (1024x1024 recommended)
# Then run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#1A237E"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  min_sdk_android: 24
